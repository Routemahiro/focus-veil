<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus Veil</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="preview-backdrop" aria-hidden="true">
      <div class="preview-window">
        <div class="preview-toolbar">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="preview-content">
          <div class="preview-column">
            <strong>Quarterly notes</strong>
            <p>Focus Veil keeps the workspace readable while softening unused areas.</p>
            <p>Text, forms, and controls should remain visible behind the overlay.</p>
          </div>
          <div class="preview-list">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>
    <canvas id="veil-canvas" aria-hidden="true"></canvas>
    <div class="operation-dismiss" aria-hidden="true"></div>
    <main class="overlay-ui" aria-label="Focus Veil timer">
      <section class="timer-panel" data-mode="work">
        <div class="timer-line">
          <span class="mode-label" id="mode-label">Focus</span>
          <span class="time-readout" id="time-readout">25:00</span>
        </div>
        <div class="timer-controls" aria-label="Timer controls">
          <button type="button" data-action="start">Start</button>
          <button type="button" data-action="pause">Pause</button>
          <button type="button" data-action="reset">Reset</button>
        </div>
        <div class="settings-controls" aria-label="Focus Veil settings">
          <label class="range-line">
            <span>Veil</span>
            <input
              type="range"
              data-setting="veilAlpha"
              min="0.04"
              max="0.30"
              step="0.01"
              value="0.14"
            >
          </label>
          <label class="range-line">
            <span>Size</span>
            <input
              type="range"
              data-setting="spotlightRadius"
              min="140"
              max="360"
              step="5"
              value="245"
            >
          </label>
          <label class="range-line">
            <span>Soft</span>
            <input
              type="range"
              data-setting="spotlightSoftness"
              min="0.35"
              max="0.90"
              step="0.01"
              value="0.68"
            >
          </label>
          <div class="number-grid">
            <label>
              <span>Focus</span>
              <input type="number" data-setting="workMinutes" min="1" max="180" step="1" value="25">
            </label>
            <label>
              <span>Break</span>
              <input type="number" data-setting="breakMinutes" min="1" max="60" step="1" value="5">
            </label>
          </div>
          <label class="toggle-line" title="Water ripples and ambient wave lines.">
            <input type="checkbox" data-setting="rippleEnabled" checked>
            <span>Ripple effects</span>
          </label>
          <label class="toggle-line">
            <input type="checkbox" data-setting="veilEnabled" checked>
            <span>Overlay enabled</span>
          </label>
          <label class="toggle-line" title="Installed Setup only. Checks GitHub Releases.">
            <input type="checkbox" data-setting="autoUpdateEnabled" checked>
            <span>Auto-update</span>
          </label>
        </div>
        <p class="shortcut-hint">ショートカット：Ctrl+Shift+F</p>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
