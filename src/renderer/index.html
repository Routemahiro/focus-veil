<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus Veil</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <canvas id="veil-canvas" aria-hidden="true"></canvas>
    <main class="overlay-ui" aria-label="Focus Veil timer">
      <section class="timer-panel" data-mode="work">
        <div class="timer-line">
          <span class="mode-label">Focus</span>
          <span class="time-readout" id="time-readout">25:00</span>
        </div>
        <div class="timer-controls" aria-label="Timer controls">
          <button type="button" data-action="start">Start</button>
          <button type="button" data-action="pause">Pause</button>
          <button type="button" data-action="reset">Reset</button>
        </div>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
